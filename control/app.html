<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#101619" />
    <title>Управление — СВОИ ГРУЗЫ</title>
    <link rel="manifest" href="/control/manifest.webmanifest" />
    <link rel="stylesheet" href="/control/vendor/tabler/tabler-icons.min.css" />
    <link rel="stylesheet" href="/site/css/control.min.css?v=20261014-push" />
    <script src="/control/assets/control.js?v=20261014-push" defer></script>
  </head>
  <body class="control-page">
    <div class="control-shell">
      <aside class="control-sidebar" aria-label="Основная навигация">
        <a class="control-brand control-brand--sidebar" href="#/dashboard">
          <span class="control-brand__mark">СГ</span>
          <span><b>СВОИ ГРУЗЫ</b><small>управление</small></span>
        </a>

        <nav class="control-nav">
          <a href="#/dashboard" data-route="dashboard"><i class="ti ti-layout-dashboard"></i><span>Обзор</span></a>
          <a href="#/requests" data-route="requests"><i class="ti ti-inbox"></i><span>Заявки</span></a>
          <a href="#/clients" data-route="clients"><i class="ti ti-users"></i><span>Клиенты</span></a>
          <a href="#/fleet" data-route="fleet"><i class="ti ti-truck"></i><span>Автопарк</span></a>
          <a href="#/tasks" data-route="tasks"><i class="ti ti-checklist"></i><span>Задачи</span></a>
          <a href="#/finances" data-route="finances"><i class="ti ti-wallet"></i><span>Финансы</span></a>
          <a href="#/settings" data-route="settings"><i class="ti ti-settings"></i><span>Настройки</span></a>
        </nav>

        <div class="control-sidebar__footer">
          <div class="user-chip">
            <span class="user-chip__avatar" id="user-avatar">В</span>
            <span class="user-chip__text"><b id="user-name">Владелец</b><small id="user-role">OWNER</small></span>
          </div>
          <button class="icon-button" type="button" data-action="logout" aria-label="Выйти">
            <i class="ti ti-logout"></i>
          </button>
        </div>
      </aside>

      <section class="control-workspace">
        <header class="control-mobile-header">
          <a class="control-brand" href="#/dashboard">
            <span class="control-brand__mark">СГ</span>
            <span><b>СВОИ ГРУЗЫ</b><small>управление</small></span>
          </a>
          <button class="icon-button" type="button" data-action="logout" aria-label="Выйти"><i class="ti ti-logout"></i></button>
        </header>
        <main id="app" class="control-main" tabindex="-1"></main>
      </section>

      <nav class="control-bottom-nav" aria-label="Мобильная навигация">
        <a href="#/dashboard" data-route="dashboard"><i class="ti ti-layout-dashboard"></i><span>Обзор</span></a>
        <a href="#/requests" data-route="requests"><i class="ti ti-inbox"></i><span>Заявки</span></a>
        <button type="button" class="control-bottom-nav__create" data-action="new-request" aria-label="Новая заявка"><i class="ti ti-plus"></i></button>
        <a href="#/clients" data-route="clients"><i class="ti ti-users"></i><span>Клиенты</span></a>
        <a href="#/more" data-route="more"><i class="ti ti-dots"></i><span>Ещё</span></a>
      </nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
  </body>
</html>
